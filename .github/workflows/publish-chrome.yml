name: Publish to Chrome Web Store

on:
  push:
    tags:
      - "v*"
  # 手动触发：把某个已发布的 tag 版本推到商店（默认取最新 v* tag）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(git describe --tags --abbrev=0 --match "v*")
          fi

          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag '${TAG}'. Use semver tags like v1.2.3"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG} → version: ${VERSION}"

      - name: Checkout tag
        if: github.event_name == 'workflow_dispatch'
        run: git checkout "${{ steps.meta.outputs.tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Sync manifest.json version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          jq --arg version "$VERSION" '.version = $version' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          echo "Updated manifest.json version to: $VERSION"
          cat manifest.json

      - name: Build and package extension
        run: |
          mkdir -p dist/chrome/icons
          cp manifest.json popup.html script.js styles.css dist/chrome/
          cp -r icons/* dist/chrome/icons/
          cd dist/chrome
          zip -r "../chrome-extension.zip" *
          cd ..
          ls -lh chrome-extension.zip

      - name: Verify manifest version
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const expected = '${{ steps.meta.outputs.version }}';
          const manifest = JSON.parse(
            fs.readFileSync('dist/chrome/manifest.json', 'utf8')
          );
          if (manifest.version !== expected) {
            console.error(\`manifest.version=\${manifest.version}, expected=\${expected}\`);
            process.exit(1);
          }
          console.log('manifest.version OK:', manifest.version);
          "

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
        run: |
          if [ -z "$EXTENSION_ID" ]; then
            EXTENSION_ID="eeciepimabplbolbjbpellekfbljhbgk"
          fi

          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::error::Missing Chrome Web Store secrets. Configure CHROME_WEB_STORE_CLIENT_ID, CHROME_WEB_STORE_CLIENT_SECRET, and CHROME_WEB_STORE_REFRESH_TOKEN."
            exit 1
          fi

          npx --yes chrome-webstore-upload-cli@3 upload \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --source "dist/chrome-extension.zip" \
            --auto-publish
