name: Publish to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version (e.g., v1.0.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout default branch
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        
    - name: Validate tag exists
      run: |
        TAG="${{ inputs.tag }}"
        if [ -z "$TAG" ]; then
          echo "Error: Tag is required"
          exit 1
        fi
        
        echo "Checking if tag $TAG exists..."
        
        # 获取所有远程 tags
        git fetch --tags
        
        # 检查 tag 是否存在
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "✓ Tag $TAG exists"
        else
          echo "✗ Error: Tag $TAG does not exist"
          echo ""
          echo "Available tags:"
          git tag -l | tail -10
          exit 1
        fi
        
    - name: Checkout code from tag
      uses: actions/checkout@v3
      with:
        ref: ${{ inputs.tag }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install
        sudo apt-get update && sudo apt-get install -y jq
        
    - name: Extract version from tag
      id: version
      run: |
        TAG="${{ inputs.tag }}"
        VERSION=${TAG#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION from tag: $TAG"
        
    - name: Update manifest.json version
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        jq --arg version "$VERSION" '.version = $version' manifest.json > manifest.tmp
        mv manifest.tmp manifest.json
        echo "Updated manifest.json version to: $VERSION"
        cat manifest.json
        
    - name: Build Chrome Extension
      run: |
        mkdir -p dist/chrome/icons
        cp manifest.json popup.html script.js styles.css dist/chrome/
        cp -r icons/* dist/chrome/icons/
        cd dist/chrome
        zip -r "../chrome-extension.zip" *
        cd ..
        ls -lh chrome-extension.zip
        
    - name: Publish to Chrome Web Store
      uses: FoxyDoxy/chrome-web-store-upload@v1.0.0
      with:
        extension-id: 'eeciepimabplbolbjbpellekfbljhbgk'
        client-id: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
        client-secret: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
        refresh-token: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
        zip-file: 'dist/chrome-extension.zip'
        publish: true

